name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      # Keep LF line endings on Windows: configure is a shell script.
      - name: Disable autocrlf
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make diffutils mingw-w64-ucrt-x86_64-gcc

      - name: Install ncurses
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Test
        run: |
          [ "$RUNNER_OS" = Windows ] && export EXEEXT=.exe
          sh .github/scripts/smoke-test.sh .
